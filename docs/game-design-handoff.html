# 游泳竞速游戏 · 设计交接文档（策划向）

> 本文档面向新接手的策划同事，**由粗到细**介绍游戏是什么、怎么玩、每个系统在代码里的真实实现，以及“该去哪里改数值”。
>
> ⚠️ **以代码为准**：本文所有数值与规则都来自当前 assets/scripts 源码（校对于 2026-07）。docs/ 下其他文档是设计草稿，可能已过期，冲突时以本文/代码为准。文末第 12 节列出了“文档写了但代码没做/没启用”的点。

---

## 1. 一句话概述

一款**横版 3D 自由泳竞速**小游戏（Cocos Creator 3.8.8，目标平台微信小游戏）。玩家在 8 泳道里，通过**跳水起跳 → 划水节奏 → 冲刺**，比 7 个 AI 对手更快游到终点。核心乐趣 = **踩点划水的节奏手感** + **心率/体力的取舍策略**。

- 赛道：单程 50m，可选 50/100/200m（默认 **100m**，即游 2 趟折返）。
- 操作极简：**全屏点按**（手机）或 A / D（键盘调试）。
- 名次：所有选手到终点后按用时排名。

---

## 2. 核心体验循环

玩家在一局里不断重复的“操作 → 反馈 → 决策”闭环：

```mermaid
flowchart LR
    A[点按/长按屏幕] --> B{松手时机<br/>落在甜区?}
    B -- 完美/良好 --> C[划水推进力大<br/>速度上升]
    B -- 偏差 --> D[推进力小<br/>掉速]
    C --> E[心率进入最佳区<br/>划水更高效]
    D --> E
    E --> F{还剩体力?<br/>该稳还是该拼?}
    F --> A
    F -- 到85%赛程 --> G[进入冲刺阶段]
    G --> A
```

一句话：**踩准节奏 → 加速 → 心率进最佳区 → 效率更高 → 但拼太狠会心率过载 + 体力耗尽**。

---

## 3. 游戏流程状态机（一局的生命周期）

代码里有 7 个状态（GameState），由 RaceManager 和 GameFlowController 驱动。

```mermaid
stateDiagram-v2
    [*] --> READY
    READY --> PRECOUNTDOWN: 玩家点屏开始
    PRECOUNTDOWN --> COUNTDOWN: 相机绕场完成
    COUNTDOWN --> DIVING: 3秒倒计时结束
    DIVING --> GLIDING: 跳水入水
    GLIDING --> RACING: 滑行0.72秒后
    RACING --> FINISHED: 所有选手到终点
    FINISHED --> READY: 点屏重来
```

| 状态 | 玩家做什么 | 系统做什么 | 关键数值 |
|---|---|---|---|
| **READY** | 点屏开始 | 相机广播式绕场 | — |
| **PRECOUNTDOWN** | 等待 | 相机运镜到起跳台 | — |
| **COUNTDOWN** | **点/按屏幕蓄跳水力** | 3、2、1 倒计时 | COUNTDOWN_SECONDS = 3 |
| **DIVING** | **松手起跳**（决定入水质量） | 玩家 & AI 按各自力度跳水 | 见第 5 节跳水 |
| **GLIDING** | **抖腿踢水抗阻力**（点按=踢腿推进） | 播放入水滑行；叠加潜水额外阻力 | GLIDE_SECONDS = 0.72 |
| **RACING** | **划水节奏比赛**（本体） | 逐帧算速度/进度/名次；85% 处进冲刺 | 见第 4–8 节 |
| **FINISHED** | 点屏重来 | 结算名次、用时、节奏统计 | — |

> 数值来源：GameBalance.ts。

---

## 4. 玩家操作模型（极简三合一按键）

**同一个按键**（一次点按），根据“按住时长”被解释成不同动作。逻辑在 InputRouter + Swimmer。

```mermaid
flowchart TD
    P[按下屏幕] --> K[立即触发一次<br/>对侧腿踢水]
    P --> H{按住是否超过<br/>0.16秒?}
    H -- 否, 快速松开 --> T[只算一次踢腿<br/>纯打腿推进]
    H -- 是, 按住再松 --> A[升级为手臂划水<br/>看松手时机打分]
```

- 手机端全屏点按，InputRouter 会**自动交替**判定为 LEFT / RIGHT（左右手轮流划），玩家不用管左右。
- 键盘 A / D 是显式左右划水（编辑器/调试用）。
- **左右必须交替**：同一侧上一划还没结束时，再点这一侧会被忽略（_nextSide 强制交替）。
- 触摸区是**隐形全屏**，不要加可见的左右按钮（除非明确要求）。

> 关键阈值：STABILITY_TUNING.minHoldSeconds = 0.16（InputTuning.ts）——区分“踢腿”和“手臂划水”。

---

## 5. 核心机制：划水“甜区”节奏打分

这是**整个游戏的手感核心**。一次手臂划水 = 按下（手入水开始划）→ 屏幕上手臂沿一个圆周拉动 → **在正确时机松手**（手出水）。松手时手臂划到的进度决定评分。

```mermaid
flowchart LR
    z0["0.0 太早 BAD"] --- g1["0.22 良好区起"]
    g1 --- p1["0.34 完美区起"]
    p1 --- p2["0.46 完美区止"]
    p2 --- g2["0.50 良好区止"]
    g2 --- z1["之后 太晚 BAD/超时"]
```

| 评分 | 松手进度落点 | 稳定度 stability | 效果 |
|---|---|---|---|
| **PERFECT 完美** | 0.34 – 0.46 | 1.0 | 推进力最大，combo +1 |
| **GOOD 良好** | 0.22 – 0.50（非完美段） | ~0.98 | 推进力略低，combo 不变 |
| **BAD 偏差** | 区间外 / 超时 | 0 | 只有极小推进，combo 归零 |

- 甜区是**周期的固定比例**，不是固定毫秒。所以**速度越快 → 手臂划水周期越短 → 甜区的实际时间窗越窄 → 越难踩准**。
  - 低速周期 ≈ 0.82 圈/秒（甜区窗 ~150ms）；高速 ≈ 2.8 圈/秒（甜区窗 ~43ms）。
- 按住太久不放（划过 0.5 周期）会**超时判负**，只给一点点推进 armStrokeTimeoutAccel = 0.08。

**跳水（COUNTDOWN→DIVING）也是同一套“时机”思想**：蓄力条来回摆动（chargeCycleSeconds = 1.6），松手瞬间的力度 power(0.18–1.0) 决定：

| 跳水档 | power | 入水质量 | 起跳初速 | 前几划稳定性 | 到达心率最佳区所需划数 |
|---|---|---|---|---|---|
| HIGH | >0.72 | CLEAN 干净 | 快 | 抖动小(×0.3) | 2 划 |
| OK | 0.42–0.72 | NORMAL | 中 | ×0.6 | 4 划 |
| LOW | <0.42 | MESSY 狼狈 | 慢 | ×1.0 | 7 划 |

> 数值：DiveResolver.ts、GameBalance.ts（DIVE_BALANCE）。起跳初速 minLaunchSpeed 4.2 ~ maxLaunchSpeed 8.2 m/s。

### 5.1 潜水滑行阶段（GLIDING）也要操作

入水后不是纯发呆滑行：**潜水阶段叠加了一份额外阻力 glideDrag（默认 0.35，∝ 速度）**，入水的高速会持续被拉低、越快掉得越猛。玩家需要**不停点按抖腿踢水**来对抗——每次点按触发一次腿部踢水推进（diveUnderwaterKickAccel = 0.18），维持住入水冲刺换来的速度。

```mermaid
flowchart LR
    IN[高速入水] --> DRAG[潜水额外阻力<br/>glideDrag 拉低速度]
    DRAG --> Q{持续抖腿踢水?}
    Q -- 是 --> KEEP[踢水推进抵消阻力<br/>速度维持]
    Q -- 否 --> DROP[速度很快缩减]
    KEEP --> UP[浮出水面转入正常游泳]
    DROP --> UP
```

- 此阶段**只踢腿、不算手臂划水**（长按不会升级为划水，也不判甜区）。
- AI 靠模拟点按走**同一条潜水踢水链路**，同样受额外阻力约束，两边公平。
- 关键参数：SWIMMER_BALANCE.glideDrag（潜水阻力）、diveUnderwaterKickAccel（踢水推进），均可在调试面板“速度”分组实时调 / 存 tuning.json。

---

## 6. 推进与速度模型（手臂是发动机，腿是辅助）

速度每帧 = 上一帧速度 + (划水加速 + 踢腿加速) × 高速衰减 − 阻力。实现见 SwimPhysicsModel 与 SwimmerMotor。

```mermaid
flowchart LR
    ARM["手臂划水<br/>按甜区评分"] -->|"stability×1.6 + 0.05"| ACC["本帧加速度"]
    LEG["踢腿<br/>按点击频率"] -->|"0.34 × 频率Hz"| ACC
    HR["心率区效率系数"] -->|"×0.65~1.2"| ACC
    ACC --> SPD["速度"]
    SPD -->|"阻力 0.06 + 0.03v + 0.03v²"| SPD
    SPD --> CAP{"封顶"}
    CAP -->|"手臂可达 4.0"| MAX["maxSpeed"]
    CAP -->|"纯踢腿只到 2.1"| KMAX["kickMaxSpeed"]
```

要点（数值全在 SWIMMER_BALANCE，GameBalance.ts）：

- **手臂 = 真发动机**：maxSpeed = 4.0 m/s 只能靠划水达到；完美划水加速 strokeBaseAccel 0.05 + strokeStabilityAccel 1.6。
- **腿 = 辅助/铺垫**：踢得越快加速越快（kickAccelPerHz 0.34 × 频率，频率封顶 8Hz），但**纯踢腿最高只有 kickMaxSpeed 2.1 m/s**，接近时加速渐隐。
- **越快越难维持**：加速随速度接近上限而衰减；阻力随速度平方增长。
- **起始速度** baseSpeed 0.8；强力跳水可短暂超速（+0.9 上限，0.45/s 衰减回落）。

---

## 7. 深度机制：心率 + 体力（策略层）

这是让“无脑狂点”行不通的系统。每次划水结算都会喂给心率模型，心率所处**区间**反过来影响划水**效率**和体力**消耗**。实现：PlayerConditionModel + ConditionBalance，在 GameManager 每帧接入速度。

心率是 0–200 的生理刻度，会向“持续努力度”决定的目标值缓动：

```mermaid
flowchart LR
    LOW["LOW 低<br/>0-110<br/>效率×0.65 质量×0.7"] --> OPT["OPTIMAL 最佳区<br/>110-150<br/>效率×1.2 质量×1.25<br/>最划算"]
    OPT --> HP["HIGH_PRESSURE 高压<br/>150-175<br/>效率×0.95"]
    HP --> OVL["OVERLOAD 过载<br/>175-200<br/>效率×0.78 但耗体力最凶"]
```

| 系统 | 规则 | 关键数值 |
|---|---|---|
| **心率** | 稳定发力自然稳定在 **OPTIMAL 最佳区**；过度用力才爬到高压/过载 | 静息 70，满努力目标 140；上升 42/s，回落 26/s |
| **效率修正** | 心率区决定划水推进的实际倍率（喂进第 6 节的 efficiencyModifier） | OPTIMAL ×1.2 最高，OVERLOAD ×0.78 |
| **体力** | 每划消耗，心率越高耗得越快；耗尽有惩罚（不失控） | 总量 100；每划耗 LOW 0.3 / OPTIMAL 1.0 / 高压 1.5 / 过载 2.5 |

**设计意图**：最优打法 ≠ 一直最大力，而是**把心率维持在 110–150 的最佳区**，用最高效率省着体力，留给最后冲刺。

> HUD 上有**心率条**和**体力条**实时显示。

---

## 8. 冲刺阶段（Sprint）

玩家推进到**赛程 85%** 时（SPRINT_TRIGGER_FRACTION = 0.85）自动进入冲刺，系统根据这段的“持续努力度”判定 3 个档位：

| 档位 | 触发努力度 | 体力消耗倍率 | 定位 |
|---|---|---|---|
| **STEADY 稳住** | < 0.6 | ×1.0 | 保守可持续 |
| **PUSH 加压** | 0.6 – 0.85 | ×1.6 | 激进但吃体力 |
| **GAMBLE 搏命** | ≥ 0.85 | ×2.5 | 全力，崩盘风险高 |

冲刺阶段心率推力更强（SPRINT phase hrPushScale 1.5），是“压体力换名次”的收官博弈。

---

## 9. AI 对手

- 满员一局 = **8 泳道**：玩家在 **3 号道**，其余 7 道是 AI（GameManager PLAYER_LANE_INDEX=3）。
- AI 走**和玩家完全相同的划水链路**（按住→松手→踩甜区），不是另一套匀速模型。
- 每个 AI 由**单一难度参数 difficulty (0–1)** 驱动，同时决定：
  - **踩甜区的准度**：难度越高，松手落点越接近完美中心（噪声 σ 从 0.12 收窄到 0.004）。
  - **划水节奏快慢**：难度越高，两划间隔越短。
- 8 条默认难度：0.5 ~ 0.9（CompetitorConfig.ts DEFAULT_AI_PROFILES），bpmOffset 做每道微调避免整齐划一。
- AI 也有独立心率/体力模型（AiConditionModel），会累积疲劳。
- 调试 1v1 模式提供难度档：入门0.3 / 普通0.5 / 困难0.7 / 高手0.85 / 大师0.98。

## 12. 调参与调试入口

- **调试面板**是主要调参界面：参数定义与持久化在 TuningDebugControls.ts。运行时按 K 等热键切换调试开关。
- **保存的调参** = 纯 JSON：assets/resources/config/tuning.json，游戏启动时 GameManager.onLoad() 会加载它**覆盖默认值**。参数 id 用英文键，如 speed.strokeBaseAccel、motion.animationSpeedScale。
- 新增“手感参数”若影响比赛体验，应同时接到调试面板并允许 tuning.json 覆盖。
- 调试模型/姿态预览是独立于比赛的另一套流程（ModelDebugFlowController），策划一般不用关心。

## 13. 注意事项（代码现状 vs 直觉）

这些点容易被文档或命名误导，交接时特别提醒：

1. **Combo 目前不直接加速**：RHYTHM_BALANCE.comboPerfectBonus / maxComboBonus 在代码里**没有接到速度上**（comboSpeedBonus 仅用于调试日志）。combo 现在的作用是**统计/展示 + 归零反馈**；真正的速度奖励来自“甜区评分 → 加速度”和“心率区效率”。若要让连击直接加速，需要额外接线。
2. **游泳动作是纯代码程序化姿态**，不是烘焙动画（性能瓶颈也在这里）。
3. **心率模型是“均衡缓动”**：稳定发力会自然停在最佳区，不是只升不降的老式设计。
4. ConditionBalance.ts 的具体数值**尚未数值锁定**，是可调的 v1 起点。
5. 其他 docs/*.zh.md（design-skeleton、runtime-interfaces 等）是**设计草稿**，与代码冲突时以代码/本文为准。

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

  const src = document.getElementById('source').textContent;
  // 用自定义 renderer 把 ```mermaid 代码块变成 <div class="mermaid">
  const renderer = new marked.Renderer();
  const origCode = renderer.code.bind(renderer);
  renderer.code = (code, lang) => {
    const text = typeof code === 'object' ? code.text : code;
    const language = typeof code === 'object' ? code.lang : lang;
    if (language === 'mermaid') return `<div class="mermaid">${text}</div>`;
    return origCode(typeof code === 'object' ? code : { text: code, lang });
  };
  marked.setOptions({ renderer });
  document.getElementById('doc').innerHTML = marked.parse(src);

  mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose', flowchart: { htmlLabels: true } });
  await mermaid.run({ querySelector: '.mermaid' });
</script>
