<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>海龟细描边对照</title><link rel="icon" href="data:,"><style>
*{box-sizing:border-box}body{margin:0;background:#173244;color:#effaff;font:16px/1.6 system-ui}main{max-width:1440px;margin:auto;padding:24px}h1{margin:0;font-size:26px}p,small{color:#bcdae5}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}canvas{width:100%;display:block;border-radius:12px}label{display:inline-block;margin:14px 24px 14px 0}select{padding:6px}input{vertical-align:middle}.note{margin-top:16px}strong{display:block;margin-bottom:8px}</style>
<main><h1>海龟：保留配色，补一层细轮廓</h1><p>左侧无描边，右侧仅龟壳、头尾和四鳍加深蓝灰细描边；拖圈、绳索保持原样。</p>
<label>取景 <select id="view"><option value="body">海龟近景</option><option value="all">海龟与人物</option><option value="small">远景尺寸</option></select></label>
<label>角度 <input id="angle" type="range" min="-180" max="180" value="35"></label><label>摆鳍 <select id="pose"><option value="0">游动中</option><option value="1">上摆</option><option value="2">下摆</option></select></label>
<div class="pair"><div><strong>原版 · 无描边</strong><canvas id="before" width="1100" height="780"></canvas></div><div><strong>细描边 · 深蓝灰</strong><canvas id="after" width="1100" height="780"></canvas></div></div>
<p class="note">独立 WebGL 离线对照，读取正式模型及摆鳍变换，使用同样的法线外扩和背面绘制方式。人物为真实抓圈姿态样件、简化检查材质；水面仅作颜色背景，不模拟引擎透明水面与水下着色。正式主镜头、画中画及手机效果仍需实机确认。</p></main>
<script>
const DATA=/*__DATA__*/;
const $=id=>document.getElementById(id),sub=(a,b)=>a.map((v,i)=>v-b[i]),dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0),norm=a=>{const l=Math.hypot(...a);return a.map(v=>v/l)},cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
function mult(a,b){const o=Array(16).fill(0);for(let c=0;c<4;c++)for(let r=0;r<4;r++)for(let k=0;k<4;k++)o[c*4+r]+=a[k*4+r]*b[c*4+k];return o}
function camera(eye,target,aspect){const z=norm(sub(eye,target)),x=norm(cross([0,1,0],z)),y=cross(z,x),view=[x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,eye),-dot(y,eye),-dot(z,eye),1],f=1/Math.tan(32*Math.PI/360);return mult([f/aspect,0,0,0,0,f,0,0,0,0,-1.002,-1,0,0,-.2002,0],view)}
function renderer(id){const canvas=$(id),gl=canvas.getContext('webgl',{antialias:true,preserveDrawingBuffer:true});if(!gl)throw Error('WebGL 不可用');
const shader=(type,source)=>{const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s};
const p=gl.createProgram();gl.attachShader(p,shader(gl.VERTEX_SHADER,'attribute vec3 position;attribute vec3 normal;attribute vec4 color;uniform mat4 vp;uniform float width;varying vec4 c;void main(){gl_Position=vp*vec4(position+normal*width,1.);c=color;}'));
gl.attachShader(p,shader(gl.FRAGMENT_SHADER,'precision highp float;varying vec4 c;uniform vec4 ink;uniform float width;void main(){vec3 linear=max(c.rgb,vec3(0.));vec3 srgb=mix(linear*12.92,1.055*pow(linear,vec3(1./2.4))-.055,step(vec3(.0031308),linear));gl_FragColor=width>0.?ink:vec4(srgb,1.);}'));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));gl.useProgram(p);
const loc={};for(const key of ['position','normal','color'])loc[key]=gl.getAttribLocation(p,key);for(const key of ['vp','width','ink'])loc[key]=gl.getUniformLocation(p,key);const cache=new Map();
return {gl,begin(eye,target){gl.depthMask(true);gl.clearColor(.20,.64,.73,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.enable(gl.CULL_FACE);gl.uniformMatrix4fv(loc.vp,false,new Float32Array(camera(eye,target,canvas.width/canvas.height)))},draw(g,width=0,ink=[0,0,0,1]){
if(!cache.has(g)){const b={};for(const [key,data] of Object.entries({position:g.positions,normal:g.normals?.length?g.normals:Array(g.positions.length).fill(0),color:g.colors||Array(g.positions.length/3).fill([.3,.3,.3,1]).flat()})){b[key]=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b[key]);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data),gl.STATIC_DRAW)}b.indices=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,b.indices);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(g.indices),gl.STATIC_DRAW);cache.set(g,b)}
const b=cache.get(g);for(const key of ['position','normal','color']){gl.bindBuffer(gl.ARRAY_BUFFER,b[key]);gl.enableVertexAttribArray(loc[key]);gl.vertexAttribPointer(loc[key],key==='color'?4:3,gl.FLOAT,false,0,0)}gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,b.indices);gl.cullFace(width?gl.FRONT:gl.BACK);gl.depthMask(!width);gl.uniform1f(loc.width,width);gl.uniform4fv(loc.ink,ink);gl.drawElements(gl.TRIANGLES,g.indices.length,gl.UNSIGNED_SHORT,0);
}}}
const renderers=['before','after'].map(renderer);
function draw(){const a=+$('angle').value*Math.PI/180,mode=$('view').value,wide=mode!=='body',distance=mode==='small'?27:wide?12:7,target=wide?[-1.6,0,.5]:[0,.12,0],eye=[target[0]+Math.cos(a)*distance,target[1]+distance*.62,target[2]+Math.sin(a)*distance],frame=DATA.frames[+$('pose').value];
renderers.forEach((r,i)=>{r.begin(eye,target);frame.filter(g=>!g.outline).forEach(g=>r.draw(g));if(wide)DATA.character.forEach(g=>r.draw(g));if(wide)DATA.character.forEach(g=>r.draw(g,.004,[3/255,5/255,8/255,1]));if(i)frame.filter(g=>g.outline).forEach(g=>r.draw(g,DATA.style.lineWidth*.001,DATA.style.color.map(v=>v/255)))});window.reviewErrors=renderers.map(r=>r.gl.getError())}
for(const id of ['view','angle','pose'])$(id).addEventListener('input',draw);window.setReview=(view,angle,pose)=>{$('view').value=view;$('angle').value=angle;$('pose').value=pose;draw()};draw();
</script></html>
