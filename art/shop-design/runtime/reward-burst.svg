    <path d="M244 224 L268 224 L286 54 Q256 37 226 54 Z" fill="url(#ray)" transform="rotate(135 256 256)"/>
    <path d="M244 224 L268 224 L286 54 Q256 37 226 54 Z" fill="url(#ray)" transform="rotate(180 256 256)"/>
    <path d="M244 224 L268 224 L286 54 Q256 37 226 54 Z" fill="url(#ray)" transform="rotate(225 256 256)"/>
    <path d="M244 224 L268 224 L286 54 Q256 37 226 54 Z" fill="url(#ray)" transform="rotate(270 256 256)"/>
    <path d="M244 224 L268 224 L286 54 Q256 37 226 54 Z" fill="url(#ray)" transform="rotate(315 256 256)"/>
  </g>

  <circle cx="256" cy="256" r="128" fill="url(#centerGlow)"/>

