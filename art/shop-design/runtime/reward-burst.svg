<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fffce4" stop-opacity=".92"/>
      <stop offset=".34" stop-color="#ffe681" stop-opacity=".50"/>
      <stop offset="1" stop-color="#ffc83d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ray" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff7c4" stop-opacity=".12"/>
      <stop offset=".45" stop-color="#ffe47a" stop-opacity=".44"/>
      <stop offset="1" stop-color="#ffc83d" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="sparkleGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#ffd65b" flood-opacity=".50" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="halo"/>
      <feMerge><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#soft)">
    <path d="M244 224 L268 224 L286 54 Q256 37 226 54 Z" fill="url(#ray)"/>
    <path d="M244 224 L268 224 L286 54 Q256 37 226 54 Z" fill="url(#ray)" transform="rotate(45 256 256)"/>
